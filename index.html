<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>校園情境心臟病 Go / No-Go v3</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#d9dee8;--accent:#2563eb;--good:#15803d;--bad:#b91c1c}
*{box-sizing:border-box} body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:900px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
h1{margin:0;font-size:28px}.sub{color:var(--muted);margin:6px 0 20px}.panel{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}label{font-weight:700;font-size:14px}input,select{width:100%;font-size:16px;padding:12px;margin-top:7px;border:1px solid var(--border);border-radius:12px;background:#fff}
button{cursor:pointer;border-radius:14px;border:1px solid var(--border);padding:12px 18px;font-size:16px;font-weight:800;background:#fff;color:var(--text)}
.primary{background:#eaf1ff;border-color:#2563eb}.rules{background:#f8fafc;border-radius:14px;padding:15px;line-height:1.8;margin:18px 0}.hidden{display:none!important}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--border);border-radius:14px;text-align:center;padding:12px}.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:var(--muted)}
.game{text-align:center}.label{font-size:15px;color:var(--muted);font-weight:800;margin:5px 0 9px}.situation{min-height:120px;display:flex;align-items:center;justify-content:center;padding:22px;border-radius:18px;background:#f3f5f8;font-size:30px;font-weight:900;line-height:1.35}
.arrow{font-size:28px;margin:15px}.response{min-height:130px;display:flex;align-items:center;justify-content:center;padding:22px;border:2px dashed var(--border);border-radius:18px;font-size:34px;font-weight:900;line-height:1.35}
.feedback{min-height:36px;font-size:20px;font-weight:900;margin-top:10px}.tap{font-size:28px;padding:16px 58px;border:2px solid var(--accent);background:#eaf1ff;margin-top:4px}.tap:disabled{opacity:.35;cursor:not-allowed}.hint{font-size:14px;color:var(--muted)}
.results{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
@media(max-width:650px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.hud,.results{grid-template-columns:repeat(2,1fr)}h1{font-size:23px}.situation{font-size:25px}.response{font-size:28px}.tap{width:100%}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div><h1>🫀 校園情境 Go / No-Go</h1><p class="sub">先看情境，再看反應；適當就拍，不適當就忍住。</p></div><button id="reset">重新開始</button></div>

<section id="setup" class="panel">
<div class="grid">
<label>學生研究代碼<input id="student" value="S001" maxlength="20"></label>
<label>週次<input id="week" type="number" min="1" max="20" value="1"></label>
<label>反應作答時間<select id="time"><option value="5000">5 秒</option><option value="4000">4 秒</option><option value="3000" selected>3 秒</option><option value="2000">2 秒</option></select></label>
</div>
<div class="rules"><b>規則：</b>每題先出現校園情境，約 1.3 秒後出現反應語句。<br><b>適當、冷靜、尊重的反應 → 拍！</b><br><b>髒話、侮辱、衝動或肢體攻擊 → 忍住，不要拍。</b></div>
<button id="start" class="primary">開始20題挑戰</button>
</section>

<section id="play" class="hidden">
<div class="hud">
<div class="stat"><b id="progress">1/20</b><span>進度</span></div><div class="stat"><b id="correct">0</b><span>正確</span></div><div class="stat"><b id="fa">0</b><span>誤拍</span></div><div class="stat"><b id="rt">—</b><span>平均 RT</span></div>
</div>
<div class="panel game">
<div class="label">① 情境</div><div id="situation" class="situation"></div>
<div class="arrow">↓</div>
<div class="label">② 反應</div><div id="response" class="response"></div>
<div id="feedback" class="feedback"></div>
<button id="tap" class="tap" disabled>🖐️ 拍！</button>
<p class="hint">反應語句出現後才開始計時。覺得不適當就不要按。</p>
</div>
</section>

<section id="result" class="panel hidden">
<h2>本回合結果</h2>
<div class="results">
<div class="stat"><b id="racc">0%</b><span>總正確率</span></div><div class="stat"><b id="rhit">0%</b><span>適當反應命中率</span></div><div class="stat"><b id="rfa">0%</b><span>誤拍率</span></div><div class="stat"><b id="rrt">—</b><span>平均反應時間</span></div>
</div>
<p id="summary"></p>
<div class="actions"><button id="again" class="primary">再玩一次</button><button id="export">下載研究 CSV</button></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
const items=[
['同學走路不小心撞到你','你走路看一下啦！',1],['同學走路不小心撞到你','幹！你白痴喔！',0],
['同學突然從後面嚇你','靠！嚇死我了！',0],['同學突然從後面嚇你','嚇死我了啦！',1],
['同學沒有先問就拿你的文具','先問我再拿，好嗎？',1],['同學沒有先問就拿你的文具','你有病喔！',0],
['打球時同學失誤','沒事，下一球！',1],['打球時同學失誤','X！這也接不到！',0],
['同學開你的玩笑，你不喜歡','我不喜歡這樣，別再講了。',1],['同學開你的玩笑，你不喜歡','三小啦！',0],
['遊戲輸掉了','可惡！差一點！',1],['遊戲輸掉了','X你X！',0],
['同學插隊','欸，要排隊喔！',1],['同學插隊','滾啦！白痴喔！',0],
['同學一直碰你的身體','不要碰我，我不喜歡。',1],['同學一直碰你的身體','直接推對方並罵髒話',0],
['老師突然叫你回答問題','等一下，我想一下。',1],['老師突然叫你回答問題','小聲罵一句髒話',0],
['同學不同意你的意見','我跟你想的不一樣。',1],['同學不同意你的意見','你到底懂不懂啦，白痴！',0]
].map((x,i)=>({id:i+1,situation:x[0],response:x[1],go:!!x[2]}));
let deck=[],idx=0,ct=null,rtimer=null,shown=0,can=false,active=false,logs=[],stat={},cfg={};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function clearT(){clearTimeout(ct);clearTimeout(rtimer)}
function hud(){progress.textContent=Math.min(idx+1,20)+'/20';correct.textContent=stat.hit+stat.cr;fa.textContent=stat.fa;rt.textContent=stat.rts.length?Math.round(stat.rts.reduce((a,b)=>a+b,0)/stat.rts.length)+' ms':'—'}
function startGame(){clearT();cfg={student:student.value.trim()||'ANON',week:Math.max(1,Math.min(20,+week.value||1)),limit:+time.value||3000,contextMs:1300};deck=shuffle(items);idx=0;logs=[];stat={hit:0,miss:0,fa:0,cr:0,rts:[]};active=true;setup.classList.add('hidden');result.classList.add('hidden');play.classList.remove('hidden');next()}
function next(){if(idx>=20)return finish();can=false;tap.disabled=true;let q=deck[idx];situation.textContent=q.situation;response.textContent='';feedback.textContent='';hud();ct=setTimeout(showResponse,cfg.contextMs)}
function showResponse(){if(!active)return;response.textContent=deck[idx].response;tap.disabled=false;can=true;shown=performance.now();rtimer=setTimeout(()=>closeTrial(false),cfg.limit)}
function doTap(){if(!active||!can)return;can=false;tap.disabled=true;clearTimeout(rtimer);closeTrial(true,Math.round(performance.now()-shown))}
function closeTrial(did,ms=null){if(!active)return;can=false;tap.disabled=true;let q=deck[idx],out='';if(q.go&&did){out='Hit';stat.hit++;stat.rts.push(ms)}else if(q.go&&!did){out='Miss';stat.miss++}else if(!q.go&&did){out='False Alarm';stat.fa++}else{out='Correct Rejection';stat.cr++}
logs.push({student:cfg.student,week:cfg.week,trial:idx+1,item_id:q.id,situation:q.situation,response_text:q.response,go:q.go?1:0,response:did?1:0,rt_ms:ms??'',outcome:out,context_ms:cfg.contextMs,response_limit_ms:cfg.limit,timestamp:new Date().toISOString()});
feedback.textContent=out==='Hit'?'✓ 拍對了！':out==='Correct Rejection'?'✓ 忍住了！':out==='Miss'?'✕ 這個反應可以拍':'✕ 誤拍！這次應該忍住';feedback.style.color=(out==='Hit'||out==='Correct Rejection')?'var(--good)':'var(--bad)';idx++;hud();rtimer=setTimeout(next,750)}
function finish(){active=false;clearT();play.classList.add('hidden');result.classList.remove('hidden');let go=stat.hit+stat.miss,nogo=stat.fa+stat.cr,acc=(stat.hit+stat.cr)/20*100,hit=go?stat.hit/go*100:0,f=nogo?stat.fa/nogo*100:0,av=stat.rts.length?Math.round(stat.rts.reduce((a,b)=>a+b,0)/stat.rts.length):null;racc.textContent=acc.toFixed(1)+'%';rhit.textContent=hit.toFixed(1)+'%';rfa.textContent=f.toFixed(1)+'%';rrt.textContent=av?av+' ms':'—';summary.textContent=`研究代碼 ${cfg.student}｜第 ${cfg.week} 週｜Hit ${stat.hit}｜Miss ${stat.miss}｜誤拍 ${stat.fa}｜正確抑制 ${stat.cr}`}
function resetGame(){clearT();active=false;can=false;play.classList.add('hidden');result.classList.add('hidden');setup.classList.remove('hidden')}
function csv(){if(!logs.length)return;let cols=['student','week','trial','item_id','situation','response_text','go','response','rt_ms','outcome','context_ms','response_limit_ms','timestamp'],esc=v=>'"'+String(v).replaceAll('"','""')+'"',data='\uFEFF'+cols.join(',')+'\n'+logs.map(r=>cols.map(k=>esc(r[k])).join(',')).join('\n'),blob=new Blob([data],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`school_gonogo_${cfg.student}_week${cfg.week}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
start.addEventListener('click',startGame);tap.addEventListener('click',doTap);reset.addEventListener('click',resetGame);again.addEventListener('click',resetGame);export.addEventListener('click',csv);
</script>
</body>
</html>
